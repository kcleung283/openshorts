services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "8000:8000"
    environment:
      # One clip job at a time keeps Whisper + ffmpeg inside Docker Desktop RAM.
      - MAX_CONCURRENT_JOBS=1
      # YouTube ?t= links: pull this many minutes from the timestamp (no billing).
      - SELF_HOST_SEGMENT_MINUTES=35
      # Plain URLs with no ?t=: download at most this many minutes from the start.
      - SELF_HOST_SOURCE_CAP_MINUTES=45
    volumes:
      - .:/app
      - /app/__pycache__
      - ./output:/app/output
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - ./output:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
